
name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

jobs:
  publish:
    name: Publicar imagem no GHCR
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar codigo aprovado
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/erikgdl/cloud-devops-aws:latest
            ghcr.io/erikgdl/cloud-devops-aws:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/erikgdl/cloud-devops-aws

  deploy:
    name: Atualizar aplicacao na EC2
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::578530885674:role/cloud-devops-aws-github-deploy-role
          aws-region: us-east-1

      - name: Atualizar aplicacao pelo SSM
        env:
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
          INSTANCE_ID: i-00abd2afabcc7d2bc
        run: |
          set -euo pipefail

          [[ "$IMAGE_SHA" =~ ^[a-f0-9]{40}$ ]]

          IMAGE="ghcr.io/erikgdl/cloud-devops-aws:$IMAGE_SHA"

          PARAMS=$(jq -nc --arg image "$IMAGE" '{
            commands: [
              "set -eu",
              "cd /opt/cloud-devops-aws",
              ("docker pull " + $image),
              ("printf \"APP_IMAGE=%s\\n\" " + $image + " > .env"),
              "docker compose up -d --pull never",
              "curl -fsS --retry 10 --retry-connrefused --retry-delay 3 http://127.0.0.1/ > /dev/null"
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"

            exit 1
          fi

          echo "Deploy concluido com sucesso."