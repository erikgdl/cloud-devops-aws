---
- name: Configurar e implantar Cloud DevOps
  hosts: all
  become: true

  vars:
    app_dir: /opt/cloud-devops-aws
    app_image: ghcr.io/erikgdl/cloud-devops-aws:latest
    app_domain: devops.erikgdl.xyz
    monitor_domain: monitor.erikgdl.xyz

  tasks:
    - name: Instalar Docker e Docker Compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Habilitar e iniciar Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Criar diretorios da aplicacao e do Caddy
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/caddy"

    - name: Configurar proxy reverso e HTTPS automatico
      ansible.builtin.copy:
        dest: "{{ app_dir }}/caddy/Caddyfile"
        mode: "0644"
        content: |
          {{ app_domain }} {
              reverse_proxy web:8080
          }

          {{ monitor_domain }} {
              reverse_proxy uptime-kuma:3001
          }
      notify: Recarregar Caddy

    - name: Configurar Docker Compose
      ansible.builtin.copy:
        dest: "{{ app_dir }}/compose.yml"
        mode: "0644"
        content: |
          services:
            web:
              image: "${APP_IMAGE}"
              # Health checks locais; o acesso publico passa pelo Caddy.
              ports:
                - "127.0.0.1:8080:8080"
              restart: unless-stopped

            caddy:
              image: caddy:2-alpine
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - ./caddy:/etc/caddy:ro
                - caddy_data:/data
                - caddy_config:/config
              depends_on:
                - web
              restart: unless-stopped

            uptime-kuma:
              image: louislam/uptime-kuma:2
              ports:
                - "127.0.0.1:3001:3001"
              volumes:
                - kuma_data:/app/data
              restart: unless-stopped

          volumes:
            kuma_data:
            caddy_data:
            caddy_config:

    - name: Criar arquivo inicial da versao
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        mode: "0644"
        content: |
          APP_IMAGE={{ app_image }}
        force: false

    - name: Baixar imagem e iniciar aplicacao
      ansible.builtin.command:
        cmd: docker compose up -d --pull always
        chdir: "{{ app_dir }}"
      register: compose_result
      changed_when: >-
        'Created' in compose_result.stderr or
        'Recreated' in compose_result.stderr or
        'Started' in compose_result.stderr

    - name: Verificar resposta HTTP da aplicacao sem redirecionamento do proxy
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/
        follow_redirects: none
        status_code: 200
      register: http_result
      retries: 10
      delay: 3
      until: http_result.status == 200

  handlers:
    - name: Recarregar Caddy
      ansible.builtin.command:
        cmd: docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
        chdir: "{{ app_dir }}"
      changed_when: true